<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>{% block title %}Суперкомпилятор МФЯ{% endblock %}</title>
<style>{{ inline_css | safe }}</style>
</head>
<body>
<div class="container">
{% block body %}{% endblock %}
</div>
<script>
function copyResidual(btn) {
    var pre = btn.parentElement.querySelector("pre.code");
    if (!pre) return;
    var text = pre.innerText;
    var done = function () { flashCopied(btn); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
    } else {
        legacyCopy(text); done();
    }
}
function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
}
function flashCopied(btn) {
    var span = btn.querySelector("span");
    if (span && !btn.dataset.orig) btn.dataset.orig = span.textContent;
    btn.classList.add("copied");
    if (span) span.textContent = "Скопировано";
    clearTimeout(btn._t);
    btn._t = setTimeout(function () {
        btn.classList.remove("copied");
        if (span) span.textContent = btn.dataset.orig;
    }, 1500);
}
</script>
</body>
</html>
